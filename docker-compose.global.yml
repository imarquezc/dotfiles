---
services:
  postgresql:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${USER}
      POSTGRES_PASSWORD: ''
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    ports:
      - 6379:6379

volumes:
  pgdata:
  redisdata:
